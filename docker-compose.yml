services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      # Set RATELIMIT_ENABLED=false when running the end-to-end suite, which signs in many times a minute.
      RATELIMIT_ENABLED: ${RATELIMIT_ENABLED:-true}
      # The development server's debugger and reloader. Never set this to 1 in production.
      FLASK_DEBUG: ${FLASK_DEBUG:-1}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:5000:5000"
    command: sh -c "flask --app wsgi db upgrade && flask --app wsgi run --host 0.0.0.0 --port 5000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY: http://backend:5000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  db_data:
  uploads:
